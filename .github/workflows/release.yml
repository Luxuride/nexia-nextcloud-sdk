name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Derive version from tag
        id: version
        run: |
          tag=${GITHUB_REF_NAME#v}
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[0].version')
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME != workspace version $manifest" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check registry credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; add a" \
              "crates.io API token as a repository secret" >&2
            exit 1
          fi
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish_one() {
            local crate=$1 attempt output retry_at wait_seconds
            for attempt in $(seq 1 20); do
              if output=$(cargo publish -p "$crate" 2>&1); then
                echo "published $crate"
                return 0
              fi
              if grep -q "already exists on crates.io" <<<"$output"; then
                echo "$crate already published, skipping"
                return 0
              fi
              retry_at=$(sed -n \
                's/.*Please try again after \(.*\) GMT.*/\1/p' <<<"$output" \
                | head -1)
              if [ -z "$retry_at" ]; then
                echo "publishing $crate failed:" >&2
                echo "$output" >&2
                return 1
              fi
              wait_seconds=$(( $(date -u -d "$retry_at GMT" +%s) \
                - $(date -u +%s) + 15 ))
              echo "rate limited, retrying $crate in ${wait_seconds}s"
              sleep "$wait_seconds"
            done
            echo "$crate still rate limited after 20 attempts" >&2
            return 1
          }
          while read -r crate; do
            echo "::group::$crate"
            publish_one "$crate" || exit 1
            echo "::endgroup::"
          done < <(python3 scripts/crate-publish-order.py)

  github-release:
    name: github release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -uo pipefail
          notes=$(mktemp)
          if scripts/release-notes.sh "$VERSION" > "$notes" \
            && [ -s "$notes" ]; then
            args=(--notes-file "$notes")
          else
            args=(--generate-notes)
          fi
          gh release create "v$VERSION" --title "v$VERSION" "${args[@]}"
