name: Release

# Publishes every workspace crate to crates.io in dependency order.
#
# Authorisation is crates.io trusted publishing, not a stored secret: the job
# requests an OIDC token (`id-token: write`) and cargo exchanges it for a
# short-lived publishing token. Each crate is registered on crates.io to trust
# this repository (Luxuride/nexia-nextcloud-sdk) and this workflow file, so no
# CARGO_REGISTRY_TOKEN exists anywhere. scripts/sync-trusted-publishing.py
# creates those registrations and is safe to re-run after adding a crate.
#
# The run is manual on purpose: the version in Cargo.toml is the thing being
# released, so it has to be reviewed and committed before anyone presses the
# button.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and package every crate, but upload nothing
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# A second run would race the first for the same crates.io allowance and could
# upload two different commits under one version.
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Trusted publishing refuses a run from a stale or unrelated commit, and
      # publishing an unintended commit is not recoverable.
      - name: Show what is being released
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "version: $(grep -m1 '^version' Cargo.toml)"

      - name: Publish
        run: bash scripts/publish-crates.sh ${{ inputs.dry_run && '--dry-run' || '' }}
