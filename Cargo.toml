[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nextcloud-rust-sdk"
authors = ["Luxuride"]

[workspace.dependencies]
nextcloud-sdk-core = { path = "crates/core/nextcloud-sdk-core", version = "0.1.0" }
nextcloud-auth = { path = "crates/nextcloud/nextcloud-auth", version = "0.1.0" }
nextcloud-transport = { path = "crates/nextcloud/nextcloud-transport", version = "0.1.0" }
nextcloud-ocs = { path = "crates/nextcloud/nextcloud-ocs", version = "0.1.0" }
nextcloud-dav = { path = "crates/nextcloud/nextcloud-dav", version = "0.1.0" }
nextcloud-notifications = { path = "crates/nextcloud/nextcloud-notifications", version = "0.1.0" }
nextcloud-shares = { path = "crates/nextcloud/nextcloud-shares", version = "0.1.0" }
nextcloud-users = { path = "crates/nextcloud/nextcloud-users", version = "0.1.0" }
nextcloud-activity = { path = "crates/nextcloud/nextcloud-activity", version = "0.1.0" }
nextcloud-trashbin = { path = "crates/nextcloud/nextcloud-trashbin", version = "0.1.0" }
nextcloud-preview = { path = "crates/nextcloud/nextcloud-preview", version = "0.1.0" }
nextcloud-goa = { path = "crates/nextcloud/nextcloud-goa", version = "0.1.0" }
nextcloud-versions = { path = "crates/nextcloud/nextcloud-versions", version = "0.1.0" }
nextcloud-uploads = { path = "crates/nextcloud/nextcloud-uploads", version = "0.1.0" }
nextcloud-deck = { path = "crates/nextcloud/nextcloud-deck", version = "0.1.0" }
nextcloud-talk = { path = "crates/nextcloud/nextcloud-talk", version = "0.1.0" }
nextcloud-client-config = { path = "crates/nextcloud/nextcloud-client-config", version = "0.1.0" }
nextcloud-kaccounts = { path = "crates/nextcloud/nextcloud-kaccounts", version = "0.1.0" }
nextcloud-sdk-session = { path = "crates/core/nextcloud-sdk-session", version = "0.1.0" }
nextcloud-sdk-request = { path = "crates/core/nextcloud-sdk-request", version = "0.1.0" }
nextcloud-sdk-storage = { path = "crates/core/nextcloud-sdk-storage", version = "0.1.0" }
nextcloud-sdk-keyring = { path = "crates/core/nextcloud-sdk-keyring", version = "0.1.0" }
nextcloud-sdk-ratelimit = { path = "crates/core/nextcloud-sdk-ratelimit", version = "0.1.0" }
nextcloud-sdk-vfs = { path = "crates/core/nextcloud-sdk-vfs", version = "0.1.0" }
nextcloud-sdk-fuse = { path = "crates/core/nextcloud-sdk-fuse", version = "0.1.0" }

base64 = "0.23"
getrandom = { version = "0.3", features = ["std"] }
oo7 = "0.6"
reqwest = { version = "0.13", features = ["stream"] }
rusqlite = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[package]
name = "nextcloud-rust-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust client for the Nextcloud APIs, with app-facing session and request state machines"
readme = "README.md"

[dependencies]
nextcloud-sdk-core.workspace = true
nextcloud-auth.workspace = true
nextcloud-transport.workspace = true
nextcloud-ocs.workspace = true
nextcloud-dav.workspace = true
nextcloud-users.workspace = true
nextcloud-shares.workspace = true
nextcloud-notifications.workspace = true
nextcloud-activity.workspace = true
nextcloud-trashbin.workspace = true
nextcloud-preview.workspace = true
nextcloud-versions.workspace = true
nextcloud-uploads.workspace = true
nextcloud-deck.workspace = true
nextcloud-talk.workspace = true
nextcloud-client-config.workspace = true
nextcloud-kaccounts.workspace = true
nextcloud-sdk-vfs.workspace = true
nextcloud-sdk-fuse.workspace = true
nextcloud-goa.workspace = true
nextcloud-sdk-session.workspace = true
nextcloud-sdk-request.workspace = true
nextcloud-sdk-storage.workspace = true
nextcloud-sdk-keyring.workspace = true
nextcloud-sdk-ratelimit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
