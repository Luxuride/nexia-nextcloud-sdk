[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nextcloud-rust-sdk"
authors = ["Luxuride"]

[workspace.dependencies]
nextcloud-core = { path = "crates/nextcloud-core", version = "0.1.0" }
nextcloud-auth = { path = "crates/nextcloud-auth", version = "0.1.0" }
nextcloud-transport = { path = "crates/nextcloud-transport", version = "0.1.0" }
nextcloud-ocs = { path = "crates/nextcloud-ocs", version = "0.1.0" }
nextcloud-dav = { path = "crates/nextcloud-dav", version = "0.1.0" }

base64 = "0.23"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
