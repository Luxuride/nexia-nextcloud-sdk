[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nextcloud-rust-sdk"
authors = ["Luxuride"]

[workspace.dependencies]
sdk-core = { path = "crates/core/sdk-core", version = "0.1.0" }
nextcloud-auth = { path = "crates/nextcloud/nextcloud-auth", version = "0.1.0" }
nextcloud-transport = { path = "crates/nextcloud/nextcloud-transport", version = "0.1.0" }
nextcloud-ocs = { path = "crates/nextcloud/nextcloud-ocs", version = "0.1.0" }
nextcloud-dav = { path = "crates/nextcloud/nextcloud-dav", version = "0.1.0" }
nextcloud-notifications = { path = "crates/nextcloud/nextcloud-notifications", version = "0.1.0" }
nextcloud-shares = { path = "crates/nextcloud/nextcloud-shares", version = "0.1.0" }
nextcloud-users = { path = "crates/nextcloud/nextcloud-users", version = "0.1.0" }
nextcloud-activity = { path = "crates/nextcloud/nextcloud-activity", version = "0.1.0" }
nextcloud-trashbin = { path = "crates/nextcloud/nextcloud-trashbin", version = "0.1.0" }
nextcloud-preview = { path = "crates/nextcloud/nextcloud-preview", version = "0.1.0" }
nextcloud-goa = { path = "crates/nextcloud/nextcloud-goa", version = "0.1.0" }
nextcloud-versions = { path = "crates/nextcloud/nextcloud-versions", version = "0.1.0" }
sdk-session = { path = "crates/core/sdk-session", version = "0.1.0" }
sdk-request = { path = "crates/core/sdk-request", version = "0.1.0" }
sdk-storage = { path = "crates/core/sdk-storage", version = "0.1.0" }
sdk-vfs = { path = "crates/core/sdk-vfs", version = "0.1.0" }

base64 = "0.23"
getrandom = { version = "0.3", features = ["std"] }
oo7 = "0.6"
reqwest = "0.13"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[package]
name = "nextcloud-rust-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust client for the Nextcloud APIs, with app-facing session and request state machines"
readme = "README.md"

[dependencies]
sdk-core.workspace = true
nextcloud-auth.workspace = true
nextcloud-transport.workspace = true
nextcloud-ocs.workspace = true
nextcloud-dav.workspace = true
nextcloud-users.workspace = true
nextcloud-shares.workspace = true
nextcloud-notifications.workspace = true
nextcloud-activity.workspace = true
sdk-session.workspace = true
sdk-request.workspace = true
sdk-storage.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
