[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nexia-nextcloud-sdk"
authors = ["Luxuride"]

[workspace.dependencies]
nexia-nextcloud-core = { path = "crates/core/nexia-nextcloud-core", version = "0.2.1" }
nexia-nextcloud-auth = { path = "crates/nextcloud/nexia-nextcloud-auth", version = "0.2.1" }
nexia-nextcloud-transport = { path = "crates/nextcloud/nexia-nextcloud-transport", version = "0.2.1" }
nexia-nextcloud-ocs = { path = "crates/nextcloud/nexia-nextcloud-ocs", version = "0.2.1" }
nexia-nextcloud-dav = { path = "crates/nextcloud/nexia-nextcloud-dav", version = "0.2.1" }
nexia-nextcloud-notifications = { path = "crates/nextcloud/nexia-nextcloud-notifications", version = "0.2.1" }
nexia-nextcloud-shares = { path = "crates/nextcloud/nexia-nextcloud-shares", version = "0.2.1" }
nexia-nextcloud-users = { path = "crates/nextcloud/nexia-nextcloud-users", version = "0.2.1" }
nexia-nextcloud-activity = { path = "crates/nextcloud/nexia-nextcloud-activity", version = "0.2.1" }
nexia-nextcloud-trashbin = { path = "crates/nextcloud/nexia-nextcloud-trashbin", version = "0.2.1" }
nexia-nextcloud-preview = { path = "crates/nextcloud/nexia-nextcloud-preview", version = "0.2.1" }
nexia-nextcloud-goa = { path = "crates/nextcloud/nexia-nextcloud-goa", version = "0.2.1" }
nexia-nextcloud-versions = { path = "crates/nextcloud/nexia-nextcloud-versions", version = "0.2.1" }
nexia-nextcloud-uploads = { path = "crates/nextcloud/nexia-nextcloud-uploads", version = "0.2.1" }
nexia-nextcloud-deck = { path = "crates/nextcloud/nexia-nextcloud-deck", version = "0.2.1" }
nexia-nextcloud-talk = { path = "crates/nextcloud/nexia-nextcloud-talk", version = "0.2.1" }
nexia-nextcloud-client-config = { path = "crates/nextcloud/nexia-nextcloud-client-config", version = "0.2.1" }
nexia-nextcloud-kaccounts = { path = "crates/nextcloud/nexia-nextcloud-kaccounts", version = "0.2.1" }
nexia-nextcloud-sdk-session = { path = "crates/core/nexia-nextcloud-sdk-session", version = "0.2.1" }
nexia-nextcloud-sdk-request = { path = "crates/core/nexia-nextcloud-sdk-request", version = "0.2.1" }
nexia-nextcloud-sdk-storage = { path = "crates/core/nexia-nextcloud-sdk-storage", version = "0.2.1" }
nexia-nextcloud-sdk-keyring = { path = "crates/core/nexia-nextcloud-sdk-keyring", version = "0.2.1" }
nexia-nextcloud-sdk-ratelimit = { path = "crates/core/nexia-nextcloud-sdk-ratelimit", version = "0.2.1" }
nexia-nextcloud-sdk-vfs = { path = "crates/core/nexia-nextcloud-sdk-vfs", version = "0.2.1" }
nexia-nextcloud-sdk-fuse = { path = "crates/core/nexia-nextcloud-sdk-fuse", version = "0.2.1" }
nexia-nextcloud-theming = { path = "crates/nextcloud/nexia-nextcloud-theming", version = "0.2.1" }
nexia-nextcloud-sync = { path = "crates/nextcloud/nexia-nextcloud-sync", version = "0.2.1" }
nexia-nextcloud-search = { path = "crates/nextcloud/nexia-nextcloud-search", version = "0.2.1" }
nexia-nextcloud-sdk-orchestrator = { path = "crates/core/nexia-nextcloud-sdk-orchestrator", version = "0.2.1" }

base64 = "0.23"
getrandom = { version = "0.3", features = ["std"] }
# `gif` and `webp` are required, not optional: the FreeDesktop thumbnail cache stores PNG, and
# `ensure_png_bytes` decodes whatever the preview endpoint returned. Without these decoders it
# falls through to returning the input bytes unchanged, so a GIF/WebP thumbnail was written to the
# cache as non-PNG data and never rendered.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
notify = "8.0"
oo7 = "0.6"
reqwest = { version = "0.13", features = ["stream"] }
rusqlite = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[package]
name = "nexia-nextcloud-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Unofficial Rust SDK for the Nextcloud APIs: typed clients for every API area plus a managed runtime for mounts, sync, VFS hydration and events"
readme = "README.md"

[dependencies]
nexia-nextcloud-core.workspace = true
nexia-nextcloud-auth.workspace = true
nexia-nextcloud-transport.workspace = true
nexia-nextcloud-ocs.workspace = true
nexia-nextcloud-dav.workspace = true
nexia-nextcloud-users.workspace = true
nexia-nextcloud-shares.workspace = true
nexia-nextcloud-notifications.workspace = true
nexia-nextcloud-activity.workspace = true
nexia-nextcloud-trashbin.workspace = true
nexia-nextcloud-preview.workspace = true
nexia-nextcloud-versions.workspace = true
nexia-nextcloud-uploads.workspace = true
nexia-nextcloud-deck.workspace = true
nexia-nextcloud-talk.workspace = true
nexia-nextcloud-client-config.workspace = true
nexia-nextcloud-kaccounts.workspace = true
nexia-nextcloud-sdk-vfs.workspace = true
nexia-nextcloud-sdk-fuse.workspace = true
nexia-nextcloud-theming.workspace = true
nexia-nextcloud-search.workspace = true
nexia-nextcloud-sync.workspace = true
nexia-nextcloud-sdk-orchestrator.workspace = true
nexia-nextcloud-goa.workspace = true
nexia-nextcloud-sdk-session.workspace = true
nexia-nextcloud-sdk-request.workspace = true
nexia-nextcloud-sdk-storage.workspace = true
nexia-nextcloud-sdk-keyring.workspace = true
nexia-nextcloud-sdk-ratelimit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
