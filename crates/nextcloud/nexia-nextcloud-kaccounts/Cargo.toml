[package]
name = "nexia-nextcloud-kaccounts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "KDE Plasma Online Accounts (KAccounts / Accounts-SSO) integration for Nextcloud system accounts"

[features]
default = ["keyring"]
keyring = ["dep:nexia-nextcloud-sdk-keyring"]

[dependencies]
nexia-nextcloud-core.workspace = true
nexia-nextcloud-sdk-keyring = { workspace = true, optional = true }
serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
