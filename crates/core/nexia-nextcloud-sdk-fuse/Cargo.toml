[package]
name = "nexia-nextcloud-sdk-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Transient VFS FUSE driver for desktop filesystem mounting"

[dependencies]
nexia-nextcloud-core.workspace = true
nexia-nextcloud-sdk-vfs.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
