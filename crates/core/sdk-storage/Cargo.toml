[package]
name = "sdk-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Encrypted SQLite storage and keychain-held keys for the Nextcloud Rust SDK"

[features]
default = ["keychain"]
keychain = ["dep:sdk-keyring"]

[dependencies]
getrandom.workspace = true
sdk-keyring = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
