[workspace]
git_tag_enable = false
git_release_enable = false
changelog_update = false
pr_branch_prefix = "release-plz-"

[[package]]
name = "nexia-nextcloud-sdk"
changelog_path = "CHANGELOG.md"
changelog_update = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_include = [
    "nexia-nextcloud-core",
    "nexia-nextcloud-auth",
    "nexia-nextcloud-transport",
    "nexia-nextcloud-ocs",
    "nexia-nextcloud-dav",
    "nexia-nextcloud-notifications",
    "nexia-nextcloud-shares",
    "nexia-nextcloud-users",
    "nexia-nextcloud-activity",
    "nexia-nextcloud-trashbin",
    "nexia-nextcloud-preview",
    "nexia-nextcloud-goa",
    "nexia-nextcloud-versions",
    "nexia-nextcloud-uploads",
    "nexia-nextcloud-deck",
    "nexia-nextcloud-talk",
    "nexia-nextcloud-client-config",
    "nexia-nextcloud-kaccounts",
    "nexia-nextcloud-sdk-session",
    "nexia-nextcloud-sdk-request",
    "nexia-nextcloud-sdk-storage",
    "nexia-nextcloud-sdk-keyring",
    "nexia-nextcloud-sdk-ratelimit",
    "nexia-nextcloud-sdk-vfs",
    "nexia-nextcloud-sdk-fuse",
    "nexia-nextcloud-theming",
    "nexia-nextcloud-sync",
    "nexia-nextcloud-sdk-orchestrator",
]
